<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSIQ · DCTS — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Used only by the new AIM/IAM/FIM section below — MUSIQ/ORIC above stay demo-only, unchanged. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#10262B; --ink-soft:#4A5C60; --ink-faint:#7C8C8F;
    --paper:#F2F5F3; --paper-raised:#FFFFFF; --paper-line:#DCE3E0;
    --teal:#1F6F6B; --teal-dark:#164F4C; --teal-light:#E4F0EE;
    --copper:#C97A3D; --copper-light:#F7E9DB;
    --gold:#C9A227; --gold-light:#F6EFD3;
    --rose:#B24D4D; --rose-light:#F5E1DF;
    --olive:#4F8F5C; --olive-light:#E2EFE2;
    --plum:#6B5B95; --plum-light:#EAE6F2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  a{color:inherit;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--ink-soft);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  header{position:sticky;top:0;z-index:40;background:rgba(242,245,243,0.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--paper-line);}
  header .bar{height:64px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer;}
  .logo-badge{display:flex;align-items:center;gap:8px;background:var(--ink);border-radius:8px;padding:6px 12px;}
  .logo-badge .ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--paper);position:relative;}
  .logo-badge .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid var(--copper);}
  .logo-badge span{color:var(--paper);font-weight:700;font-size:13px;letter-spacing:0.03em;}
  .divider{width:1px;height:24px;background:var(--paper-line);}
  nav{display:flex;align-items:center;gap:24px;}
  .admin-link{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);text-decoration:none;cursor:pointer;}
  .admin-link:hover{color:var(--ink);}
  footer{border-top:1px solid var(--paper-line);}
  footer .bar{padding:24px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--ink-faint);font-size:12px;}

  .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:var(--ink);color:var(--paper);border:none;padding:13px 26px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:var(--paper-raised);color:var(--ink);border:1px solid var(--paper-line);padding:13px 26px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;}
  .btn-secondary:hover{border-color:rgba(16,38,43,.3);}

  .card{background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:18px;box-shadow:0 1px 2px rgba(16,38,43,0.04),0 8px 24px -12px rgba(16,38,43,0.18);}

  .hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:72px 0;}
  @media(max-width:860px){.hero{grid-template-columns:1fr;padding:48px 0;}}
  .hero h1{font-size:44px;line-height:1.05;letter-spacing:-0.01em;margin:0 0 18px;font-weight:600;}
  .hero p{color:var(--ink-soft);font-size:17px;line-height:1.6;max-width:440px;margin:0 0 28px;}
  .hero-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}

  .sections-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:64px;}
  @media(max-width:860px){.sections-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.sections-grid{grid-template-columns:1fr;}}
  .section-card{padding:20px;}
  .section-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .section-card h3{margin:0 0 6px;font-size:16px;}
  .section-card p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.55;}
  .section-card .count{margin-top:12px;color:var(--ink-faint);font-size:11px;}

  .legend-card{padding:28px 32px;margin-bottom:96px;}
  .legend-bar{height:12px;border-radius:999px;overflow:hidden;display:flex;margin-bottom:24px;}
  .legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.legend-grid{grid-template-columns:1fr;}}
  .legend-item{display:flex;align-items:flex-start;gap:12px;}
  .legend-item .lb-dot{margin-top:5px;width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .legend-item .range{color:var(--ink-soft);font-size:12px;margin:0 0 2px;}
  .legend-item .label{font-size:14px;margin:0;}

  .bg-olive{background:var(--olive);} .bg-gold{background:var(--gold);} .bg-copper{background:var(--copper);} .bg-rose{background:var(--rose);}
  .bg-teal{background:var(--teal);} .bg-ink{background:var(--ink);}

  .wizard-wrap{padding:56px 0 80px;}
  .wizard-head{display:flex;align-items:center;gap:16px;margin-bottom:40px;}
  .wizard-head h1{font-size:20px;margin:0;font-weight:600;}
  .ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
  .ring-wrap .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;}

  .wizard-grid{display:grid;grid-template-columns:200px 1fr;gap:32px;}
  @media(max-width:760px){.wizard-grid{grid-template-columns:1fr;}}

  .section-nav{display:flex;flex-direction:column;gap:6px;}
  @media(max-width:760px){.section-nav{flex-direction:row;overflow-x:auto;padding-bottom:8px;}}
  .nav-item{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 12px;cursor:pointer;border:none;background:transparent;text-align:left;font-family:inherit;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,0.6);}
  .nav-item.current{background:var(--paper-raised);box-shadow:0 1px 2px rgba(16,38,43,0.04),0 8px 24px -12px rgba(16,38,43,0.18);}
  .nav-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;flex-shrink:0;}
  .nav-label{font-size:14px;color:var(--ink-soft);white-space:nowrap;}
  .nav-item.current .nav-label{color:var(--ink);font-weight:500;}

  .qcard{padding:0 32px;}
  .qcard-desc{padding:20px 0;border-bottom:1px solid var(--paper-line);color:var(--ink-soft);font-size:14px;line-height:1.6;}
  fieldset{border:none;margin:0;padding:24px 0;border-bottom:1px solid var(--paper-line);}
  fieldset:last-of-type{border-bottom:none;}
  .qtext{margin:0 0 16px;font-size:15.5px;line-height:1.55;}
  .qnum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);margin-right:8px;}
  .scale-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);padding:0 4px;margin-bottom:8px;}
  .scale-row{display:flex;gap:8px;}
  .scale-btn{flex:1;height:44px;border-radius:8px;border:1px solid var(--paper-line);background:var(--paper-raised);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:14px;cursor:pointer;transition:all .1s;}
  .scale-btn:hover{border-color:rgba(16,38,43,.25);}
  .scale-btn.selected{color:#fff;border-color:transparent;box-shadow:0 1px 2px rgba(16,38,43,0.04),0 8px 24px -12px rgba(16,38,43,0.18);}
  .dk-btn{margin-top:10px;align-self:flex-start;border-radius:999px;border:1px solid var(--paper-line);background:transparent;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 14px;cursor:pointer;}
  .dk-btn.selected{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .yn-row{display:flex;gap:12px;}
  .yn-btn{min-width:96px;height:44px;border-radius:8px;border:1px solid var(--paper-line);background:var(--paper-raised);color:var(--ink-soft);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;}
  .yn-btn.selected{color:#fff;border-color:transparent;box-shadow:0 1px 2px rgba(16,38,43,0.04),0 8px 24px -12px rgba(16,38,43,0.18);}

  .bg-plum{background:var(--plum);}
  .oric-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  @media(max-width:560px){.oric-row{grid-template-columns:repeat(5,1fr);gap:4px;}}
  .oric-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--paper-line);background:var(--paper-raised);color:var(--ink-soft);font-family:inherit;padding:12px 4px;cursor:pointer;text-align:center;transition:all .1s;}
  .oric-btn:hover{border-color:rgba(16,38,43,.25);}
  .oric-btn.selected{color:#fff;border-color:transparent;box-shadow:0 1px 2px rgba(16,38,43,0.04),0 8px 24px -12px rgba(16,38,43,0.18);}
  .oric-btn .n{font-family:'IBM Plex Mono',monospace;font-size:14px;}
  .oric-btn .lbl{font-size:10.5px;line-height:1.25;}
  .oric-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:0 auto 40px;}
  .oric-stat{padding:14px;}
  .oric-stat .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 4px;}
  .oric-stat .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--plum);margin:0;}
  .oric-stat .of{font-size:11px;color:var(--ink-faint);margin:2px 0 0;}

  .qcard-foot{display:flex;justify-content:space-between;padding:24px 0;}

  input[type=text],textarea{width:100%;border:1px solid var(--paper-line);background:var(--paper-raised);border-radius:8px;padding:10px 14px;font-family:inherit;font-size:14px;color:var(--ink);margin-top:6px;}
  input[type=text]:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  label.field{display:block;margin-bottom:20px;}
  label.field span{font-size:14px;font-weight:500;}

  .banner{border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:24px;}
  .banner.gold{background:var(--gold-light);border:1px solid rgba(201,162,39,.3);}
  .banner.rose{background:var(--rose-light);border:1px solid rgba(178,77,77,.3);}

  .review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px;}
  @media(max-width:600px){.review-grid{grid-template-columns:1fr;}}
  .review-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--paper-line);border-radius:10px;padding:12px 16px;cursor:pointer;background:none;font-family:inherit;text-align:left;}
  .review-item:hover{border-color:rgba(16,38,43,.3);}

  .results{max-width:560px;margin:0 auto;padding:88px 24px;text-align:center;}
  .results h1{font-size:24px;margin:0 0 32px;}
  .results p.band{font-size:16px;line-height:1.6;max-width:420px;margin:32px auto 40px;}
  .results-actions{display:flex;justify-content:center;gap:12px;}

  .note{max-width:640px;margin:0 auto 32px;text-align:center;font-size:12.5px;color:var(--ink-faint);}

  .wrap-wide{max-width:1280px;margin:0 auto;padding:0 24px;}
  .admin-bar{border-bottom:1px solid var(--paper-line);background:var(--paper-raised);}
  .admin-bar .row{height:44px;display:flex;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto;padding:0 24px;}
  .signout-link{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);cursor:pointer;background:none;border:none;}
  .signout-link:hover{color:var(--ink);}

  .dash-wrap{padding:32px 0 80px;}
  .dash-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;}
  .dash-head h1{font-size:20px;margin:0;font-weight:600;}
  .preview-banner{background:var(--plum-light);border:1px solid rgba(107,91,149,.3);border-radius:10px;padding:10px 16px;font-size:12.5px;color:var(--ink);margin-bottom:20px;}

  .gauge-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  @media(max-width:760px){.gauge-grid{grid-template-columns:1fr;}}
  .gauge-card{padding:24px;text-align:center;}

  .kpi-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);}

  .section-scores-card{padding:20px 24px;margin-bottom:20px;}
  .pro-bar-row{display:grid;grid-template-columns:140px 1fr 50px;align-items:center;gap:12px;margin-bottom:12px;}
  .pro-bar-label{font-size:13px;color:var(--ink);text-align:right;}
  .pro-bar-track{height:14px;border-radius:7px;background:var(--paper-line);overflow:hidden;}
  .pro-bar-fill{height:100%;border-radius:7px;}
  .pro-bar-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--ink);}

  .charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;align-items:start;}
  @media(max-width:960px){.charts-grid{grid-template-columns:1fr;}}
  .chart-card{padding:18px 20px;}
  .chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .chart-head h3{font-size:13.5px;margin:0;font-weight:600;}
  .chart-side-stack{display:flex;flex-direction:column;gap:14px;}

  .fbar-row{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:8px;margin-bottom:5px;}
  .fbar-label{font-size:10.5px;color:var(--ink-soft);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fbar-track{height:10px;border-radius:5px;background:var(--paper-line);overflow:hidden;}
  .fbar-fill{height:100%;border-radius:5px;}
  .fbar-val{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);}

  .radar-wrap{display:flex;justify-content:center;}
  .donut-row{display:flex;align-items:center;gap:16px;}
  .donut{width:110px;height:110px;border-radius:50%;flex-shrink:0;position:relative;}
  .donut::after{content:"";position:absolute;inset:18px;background:var(--paper-raised);border-radius:50%;}
  .donut-legend{display:flex;flex-direction:column;gap:6px;font-size:11.5px;}
  .donut-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

  .oric-bar-row{margin-bottom:14px;}
  .oric-bar-row:last-child{margin-bottom:0;padding-top:10px;border-top:1px solid var(--paper-line);}
  .oric-bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .oric-bar-track{height:8px;border-radius:4px;background:var(--paper-line);overflow:hidden;}
  .oric-bar-fill{height:100%;border-radius:4px;background:var(--plum);}

  .trend-card{padding:18px 20px;margin-bottom:14px;}

  .table-card{overflow:hidden;}
  .table-head-row{padding:14px 20px;border-bottom:1px solid var(--paper-line);}
  table.subs{width:100%;border-collapse:collapse;font-size:13px;}
  table.subs th{text-align:left;padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:400;border-bottom:1px solid var(--paper-line);}
  table.subs td{padding:10px 14px;border-bottom:1px solid var(--paper-line);color:var(--ink);}
  table.subs tr:last-child td{border-bottom:none;}
  table.subs tr.rowhover:hover{background:rgba(242,245,243,0.7);}
  .score-pill{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .score-dot{width:7px;height:7px;border-radius:50%;}
  .view-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;}
  .view-btn:hover{color:var(--ink);}
  .table-scroll{overflow-x:auto;}

  .modal-overlay{position:fixed;inset:0;background:rgba(16,38,43,0.4);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;}
  .modal-card{max-width:640px;width:100%;margin:auto 0;max-height:85vh;overflow-y:auto;}
  .modal-head{position:sticky;top:0;background:var(--paper-raised);border-bottom:1px solid var(--paper-line);padding:18px 24px;display:flex;align-items:flex-start;justify-content:space-between;}
  .modal-close{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:18px;line-height:1;}
  .modal-close:hover{color:var(--ink);}
  .modal-body{padding:20px 24px;}
  .mfactor-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
  .mfactor-label{width:210px;flex-shrink:0;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mfactor-track{flex:1;height:7px;border-radius:4px;background:var(--paper-line);overflow:hidden;}
  .mfactor-fill{height:100%;border-radius:4px;}
  .mfactor-val{width:28px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink);}

  .login-wrap{max-width:380px;margin:0 auto;padding:88px 24px;}
  .login-wrap h1{font-size:19px;text-align:center;margin:0 0 6px;}
  .login-wrap p.sub{text-align:center;font-size:13px;color:var(--ink-soft);margin:0 0 28px;line-height:1.5;}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" onclick="goHome()">
      <div class="logo-badge"><span class="ring"></span><span>IQIC PK</span></div>
      <div class="divider"></div>
      <span class="eyebrow" style="display:none" id="logo-sub">MUSIQ · DCTS</span>
    </a>
    <nav>
      <span class="eyebrow" id="header-tag">Model for Understanding Success in Quality</span>
      <a class="admin-link" onclick="goLogin()">Admin</a>
    </nav>
  </div>
</header>

<main id="main"></main>

<footer>
  <div class="wrap bar">
    <span>MUSIQ instrument by Cincinnati Children's Hospital Medical Center (CC BY-NC-SA 3.0). ORIC instrument by the ImpleMentAll partners (CC BY-NC 4.0).</span>
    <span class="mono">DCTS · SIUT</span>
  </div>
</footer>

<script>
const SECTIONS = [
  { id:"qi_team", title:"QI Team", shortLabel:"Team", color:"teal",
    description:"The people who plan and carry out the tests of change, data collection, and day-to-day work of this project.",
    questions:[
      {id:"q_team_prior", text:"Most members of our QI team have worked on improvement projects before", type:"likert7"},
      {id:"q_team_diversity", text:"The QI team members have diverse professional backgrounds and experiences", type:"likert7"},
      {id:"q_team_physician", text:"There is a physician actively participating on this QI team", type:"likert7"},
      {id:"q_team_expert", text:"At least one member of the QI team is an authority on the outcome, process, or system being changed in this project", type:"likert7"},
      {id:"q_team_leader_presence", text:'The QI team leader is an ongoing "presence" in this team — someone who is readily available', type:"likert7", ref:"1"},
      {id:"q_dm_1", text:"Most members of my QI Team have a chance to participate in decision making", type:"likert7", ref:"2"},
      {id:"q_dm_2", text:"We appreciate and build on our individual differences", type:"likert7", ref:"2"},
      {id:"q_dm_3", text:"The contribution of every group member is listened to and considered", type:"likert7", ref:"2"},
      {id:"q_dm_4", text:"Our QI team applies enough knowledge and skill to get the work done well", type:"likert7", ref:"2"},
      {id:"q_dm_5", text:"We like to consider a lot of different ideas before making a decision", type:"likert7", ref:"2"},
      {id:"q_dm_6", text:"Our QI team works hard enough to get the task done well", type:"likert7", ref:"2"},
      {id:"q_norm_1", text:"QI team members agree on the project's overall goals", type:"likert7", ref:"2"},
      {id:"q_norm_2", text:"The overall goals of the project guide the activities of QI project team members", type:"likert7", ref:"2"},
      {id:"q_norm_3", text:"Members of my QI team behave as they are expected to", type:"likert7", ref:"2"},
      {id:"q_norm_4", text:"All of the QI project team members are committed to the same project goals", type:"likert7", ref:"2"},
      {id:"q_team_skill", text:"Our QI team effectively uses improvement methods (e.g., Plan-Do-Study-Act [PDSA] cycles, run charts, control charts) to make changes", type:"likert7"},
      {id:"q_team_tenure", text:"Members of our QI team were familiar with each other before they began working on this QI project", type:"likert7"}
    ]},
  { id:"microsystem", title:"Microsystem", shortLabel:"Microsystem", color:"copper",
    description:"The clinic, ward, unit, or department where this project's changes will actually be tested and used.",

function computeOricScores(oricAnswers){
  const commitVals = ORIC_QUESTIONS.filter(q=>q.subscale==="commitment").map(q=>oricAnswers[q.id]).filter(v=>typeof v==="number");
  const effVals = ORIC_QUESTIONS.filter(q=>q.subscale==="efficacy").map(q=>oricAnswers[q.id]).filter(v=>typeof v==="number");
  const commitment = commitVals.length ? commitVals.reduce((a,b)=>a+b,0)/commitVals.length : null;
  const efficacy = effVals.length ? effVals.reduce((a,b)=>a+b,0)/effVals.length : null;
  const all = [...commitVals, ...effVals];
  const overall = all.length ? all.reduce((a,b)=>a+b,0)/all.length : null;
  return {commitment, efficacy, overall};
}

function qScore(qid, raw){ return REVERSE.has(qid) ? 8-raw : raw; }
function computeScores(answers){
  const factorScores = {};
  FACTOR_DEFINITIONS.forEach(def=>{
    if(def.kind==="simple"){ factorScores[def.name] = qScore(def.q, answers[def.q] ?? 0); }
    else { const vals = def.qs.map(q=>qScore(q, answers[q] ?? 0)); factorScores[def.name] = vals.reduce((a,b)=>a+b,0)/vals.length; }
  });
  const totalScore = Object.values(factorScores).reduce((a,b)=>a+b,0);
  const band = SCORE_BANDS.find(b=>totalScore>=b.min && totalScore<=b.max) || SCORE_BANDS[SCORE_BANDS.length-1];
  return {factorScores, totalScore, band};
}

function seededRandom(seed){
  let s = seed;
  return function(){ s = (s*9301+49297)%233280; return s/233280; };
}

function generateFakeSubmissions(){
  const rand = seededRandom(42);
  const projects = ["OR-to-PICU Handover Audit","72-Hour Death Review","HAI Bundle Compliance","Structured M&M Meetings","WHO Hand Hygiene Rollout"];
  const departments = ["PCICU","Cardiac Surgery","Nursing","Data Analytics"];
  const names = ["A. Jan","S. Mohsin","A. Ghoto","R. Nadeem","S. Pervez","B. Hasan",""];
  const allFactorNames = FACTOR_DEFINITIONS.map(f=>f.name);
  const rows = [];
  const now = new Date("2026-07-19T12:00:00");

  for(let i=0;i<22;i++){
    const project = projects[Math.floor(rand()*projects.length)];
    const department = departments[Math.floor(rand()*departments.length)];
    const respondent = names[Math.floor(rand()*names.length)];
    const daysAgo = Math.floor(rand()*110);
    const created = new Date(now.getTime() - daysAgo*86400000);

    const baseline = 0.25 + rand()*0.65;
    const factor_scores = {};
    allFactorNames.forEach(name=>{
      const noise = (rand()-0.5)*2.4;
      let v = baseline*6 + 1 + noise;
      v = Math.max(1, Math.min(7, v));
      factor_scores[name] = Math.round(v*10)/10;
    });
    const total_score = Object.values(factor_scores).reduce((a,b)=>a+b,0);
    const band = SCORE_BANDS.find(b=>total_score>=b.min && total_score<=b.max) || SCORE_BANDS[SCORE_BANDS.length-1];

    const oricBaseline = Math.max(0, Math.min(1, baseline + (rand()-0.5)*0.3));
    const oric_answers = {};
    ORIC_QUESTIONS.forEach(q=>{
      let v = Math.round(oricBaseline*4 + 1 + (rand()-0.5)*1.6);
      v = Math.max(1, Math.min(5, v));
      oric_answers[q.id] = v;
    });
    const oricScores = computeOricScores(oric_answers);

    rows.push({
      id: "s"+i,
      created_at: created.toISOString(),
      project_name: project,
      respondent_name: respondent || null,
      department,
      notes: i%6===0 ? "Follow-up needed on handover documentation." : "",
      factor_scores,
      total_score: Math.round(total_score*10)/10,
      score_band: band.label,
      oric_answers,
      oric_commitment: oricScores.commitment,
      oric_efficacy: oricScores.efficacy,
      oric_overall: oricScores.overall
    });
  }
  return rows.sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
}

function ringSVG(size, stroke, pct, color, innerHTML){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#DCE3E0" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s ease"/>
    </svg>
    <div class="center">${innerHTML}</div>
  </div>`;
}

// Speedometer-style gauge with color-banded arc and a needle
function gaugeSVG(value, min, max, bandFracs, bandColors){
  const r=90, cx=110, cy=110, arcLen=Math.PI*r;
  let offset=0, paths="";
  bandFracs.forEach((f,i)=>{
    const len=f*arcLen;
    const cap = (i===0 || i===bandFracs.length-1) ? "round" : "butt";
    paths += `<path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="${bandColors[i]}" stroke-width="16" stroke-linecap="${cap}" stroke-dasharray="${len} ${arcLen}" stroke-dashoffset="${-offset}"/>`;
    offset += len;
  });
  const clamped = Math.max(min, Math.min(max, value));
  const frac = (clamped-min)/(max-min);
  const angle = frac*180 - 90;
  return `<svg width="220" height="130" viewBox="0 0 220 130">
    ${paths}
    <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-70}" stroke="#10262B" stroke-width="4" stroke-linecap="round" transform="rotate(${angle} ${cx} ${cy})" style="transition:transform .6s ease"/>
    <circle cx="${cx}" cy="${cy}" r="8" fill="#10262B"/>
    <text x="20" y="126" font-size="10" fill="#7C8C8F" font-family="IBM Plex Mono, monospace">${min}</text>
    <text x="200" y="126" font-size="10" fill="#7C8C8F" text-anchor="end" font-family="IBM Plex Mono, monospace">${max}</text>
  </svg>`;
}

function nestedRingsDiagram(){
  const layers=[{label:"Environment",r:168,color:"#4F8F5C",lc:"#2F5C39"},{label:"Organization",r:132,color:"#10262B",lc:"#10262B"},{label:"Microsystem",r:96,color:"#C97A3D",lc:"#8A501F"},{label:"QI Team",r:58,color:"#1F6F6B",lc:"#164F4C"}];
  const size=380,c=size/2;
  let circles="", labels="";
  layers.forEach((l,i)=>{ circles+=`<circle cx="${c}" cy="${c}" r="${l.r}" fill="none" stroke="${l.color}" stroke-width="1.5" opacity="0.55" ${i===0?'stroke-dasharray="3 5"':''}/>`; });
  layers.forEach(l=>{
    const a=-55*Math.PI/180, x=c+l.r*Math.cos(a), y=c+l.r*Math.sin(a);
    labels+=`<circle cx="${x}" cy="${y}" r="3" fill="${l.color}"/><text x="${x+8}" y="${y+4}" font-family="IBM Plex Mono, monospace" font-size="11" fill="${l.lc}" opacity="0.9">${l.label}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:400px;height:auto;">
    ${circles}
    <circle cx="${c}" cy="${c}" r="50" fill="#1F6F6B" opacity="0.12"/>
    <circle cx="${c}" cy="${c}" r="50" fill="none" stroke="#1F6F6B" stroke-width="2"/>
    ${labels}
    <text x="${c}" y="${c-4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#10262B" opacity="0.7">24 factors</text>
    <text x="${c}" y="${c+12}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#10262B" opacity="0.7">6 sections</text>
  </svg>`;
}

  const scale=[7,6,5,4,3,2,1];

async function submitSurvey(){
  state.result = computeScores(state.answers);
  state.oricResult = computeOricScores(state.oricAnswers);
  state.aifResult = computeAifScores(state.aifAnswers);
  if(sb){
    state.aifSubmitting = true; state.aifError = null; render();
    try{
      const pick = ids => Object.fromEntries(ids.map(id=>[id,state.aifAnswers[id]]).filter(([,v])=>v!==undefined));
      const { error } = await sb.from("aim_iam_fim_submissions").insert({
        project_name: state.meta.projectName.trim() || null,
        respondent_name: state.meta.respondentName.trim() || null,
        department: state.meta.department.trim() || null,
        intervention_name: state.meta.projectName.trim() || null,
        notes: state.meta.notes.trim() || null,
        aim_answers: pick(AIM_QUESTIONS.map(q=>q.id)),
        iam_answers: pick(IAM_QUESTIONS.map(q=>q.id)),
        fim_answers: pick(FIM_QUESTIONS.map(q=>q.id)),
        aim_score: state.aifResult.aim, iam_score: state.aifResult.iam, fim_score: state.aifResult.fim
      });
      if(error) throw error;
    }catch(e){
      state.aifSubmitting = false;
      state.aifError = "Couldn't save your AIM/IAM/FIM answers: " + (e && e.message ? e.message : "check your connection and try again.") + " Your MUSIQ and ORIC answers weren't affected — you can retry just below.";
      render();
      return;
    }
    state.aifSubmitting = false;
  }
  state.step = "done";
  render(); window.scrollTo(0,0);
}

function averageFactorScores(rows){
  return FACTOR_DEFINITIONS.map(def=>{
    const vals = rows.map(r=>r.factor_scores[def.name]).filter(v=>typeof v==="number");
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    return {factor:def.name, average: Math.round(avg*100)/100};
  });
}

function averageDomainScores(rows){
  const favg = averageFactorScores(rows);
  const lookup = {}; favg.forEach(f=>lookup[f.factor]=f.average);
  return DOMAIN_FACTOR_GROUPS.map(g=>{
    const vals = g.factors.map(f=>lookup[f]||0);
    const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
    return {domain:g.domain, color:g.color, average: Math.round(avg*100)/100};
  });
}

function averageOricScores(rows){
  const c = rows.map(r=>r.oric_commitment).filter(v=>typeof v==="number");
  const e = rows.map(r=>r.oric_efficacy).filter(v=>typeof v==="number");
  const o = rows.map(r=>r.oric_overall).filter(v=>typeof v==="number");
  return {
    commitment: c.length ? c.reduce((a,b)=>a+b,0)/c.length : null,
    efficacy: e.length ? e.reduce((a,b)=>a+b,0)/e.length : null,
    overall: o.length ? o.reduce((a,b)=>a+b,0)/o.length : null,
    respondedCount: o.length
  };
}

function bandDistribution(rows){
  return SCORE_BANDS.map(b=>({label:b.label, range:`${b.min}\u2013${b.max}`, color:b.color, count: rows.filter(r=>r.score_band===b.label).length}));
}

function domainRadarHTML(rows){
  const data = averageDomainScores(rows);
  const size=240, cx=size/2, cy=size/2, maxR=85, n=data.length;
  const pt=(i,r)=>{ const ang=(-90 + i*(360/n))*Math.PI/180; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)]; };
  const rings=[0.25,0.5,0.75,1].map(f=>{
    const pts = data.map((_,i)=>pt(i,maxR*f).join(",")).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="#DCE3E0" stroke-width="1"/>`;
  }).join("");
  const axes = data.map((_,i)=>{ const [x,y]=pt(i,maxR); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#DCE3E0" stroke-width="1"/>`; }).join("");
  const shapePts = data.map((d,i)=>pt(i, (d.average/7)*maxR).join(",")).join(" ");
  const vertexDots = data.map((d,i)=>{ const [x,y]=pt(i,(d.average/7)*maxR); return `<circle cx="${x}" cy="${y}" r="2.5" fill="#1F6F6B"/>`; }).join("");
  const labels = data.map((d,i)=>{ const [x,y]=pt(i,maxR+22); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Sans" font-size="10.5" fill="#10262B">${d.domain}</text>`; }).join("");
  const valueLabels = data.map((d,i)=>{ const [x,y]=pt(i,(d.average/7)*maxR - 12); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#164F4C">${d.average.toFixed(1)}</text>`; }).join("");
  return `
  <div class="card chart-card">
    <div class="chart-head"><h3>Domain balance</h3><span class="mono" style="font-size:10.5px;color:var(--ink-faint);">scale 0–7</span></div>
    <div class="radar-wrap">
      <svg width="${size}" height="${size+20}" viewBox="0 0 ${size} ${size+20}">
        ${rings}${axes}
        <polygon points="${shapePts}" fill="#1F6F6B" fill-opacity="0.22" stroke="#1F6F6B" stroke-width="2"/>
        ${vertexDots}
        ${valueLabels}
        ${labels}
      </svg>
    </div>
  </div>`;
}

function scoreTrendHTML(rows){
  const data = [...rows].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const w=900, h=240, padL=32, padR=16, padT=10, padB=24;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const bands = [[120,168,"#4F8F5C"],[80,119,"#C9A227"],[50,79,"#C97A3D"],[24,49,"#B24D4D"]];
  const yFor = v => padT + innerH - ((v-24)/(168-24))*innerH;
  const xFor = i => data.length<=1 ? padL+innerW/2 : padL + (i/(data.length-1))*innerW;
  const bandRects = bands.map(([lo,hi,c])=>{
    const y1=yFor(hi), y2=yFor(lo);
    return `<rect x="${padL}" y="${y1}" width="${innerW}" height="${y2-y1}" fill="${c}" opacity="0.06"/>`;
  }).join("");
  const linePts = data.map((r,i)=>`${xFor(i)},${yFor(r.total_score)}`).join(" ");
  const dots = data.map((r,i)=>{
    const band = SCORE_BANDS.find(b=>r.total_score>=b.min && r.total_score<=b.max) || SCORE_BANDS[SCORE_BANDS.length-1];
    const showLabel = data.length<=14 || i%Math.ceil(data.length/14)===0;
    return `<circle cx="${xFor(i)}" cy="${yFor(r.total_score)}" r="3.5" fill="${COLOR_HEX[band.color]}"><title>${escapeAttr(r.project_name)}: ${r.total_score.toFixed(0)}</title></circle>` +
      (showLabel ? `<text x="${xFor(i)}" y="${yFor(r.total_score)-8}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4A5C60">${r.total_score.toFixed(0)}</text>` : "");
  }).join("");
  return `
  <div class="card trend-card">
    <div class="chart-head"><h3>Total score over time</h3><span class="mono" style="font-size:10.5px;color:var(--ink-faint);">scale 24–168</span></div>
    ${data.length===0 ? '<p style="text-align:center;color:var(--ink-faint);font-size:13px;padding:40px 0;">No submissions</p>' : `
    <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible;">
      ${bandRects}
      <polyline points="${linePts}" fill="none" stroke="#1F6F6B" stroke-width="2"/>
      ${dots}
    </svg>`}
  </div>`;
}

            return `<tr class="rowhover">
              <td class="mono" style="white-space:nowrap;color:var(--ink-soft);font-size:12px;">${dateStr}</td>
              <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeAttr(r.project_name)}">${escapeHtml(r.project_name)}</td>
              <td style="color:var(--ink-soft);">${r.respondent_name?escapeHtml(r.respondent_name):"—"}</td>
              <td style="color:var(--ink-soft);">${r.department?escapeHtml(r.department):"—"}</td>
              <td style="text-align:right;"><span class="score-pill"><span class="score-dot" style="background:${COLOR_HEX[band.color]}"></span>${r.total_score.toFixed(0)}</span></td>
              <td style="text-align:right;"><button class="view-btn" onclick="openSubmission('${r.id}')" title="View this respondent's full answers">&#128065; View answers</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`}
  </div>`;
}

function submissionModalHTML(row){
  const band = SCORE_BANDS.find(b=>row.total_score>=b.min && row.total_score<=b.max) || SCORE_BANDS[SCORE_BANDS.length-1];
  const colorMap = factorColorMap();
  const d = new Date(row.created_at);
  const dateStr = d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' at ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return `
  <div class="modal-overlay" onclick="closeSubmission()">
    <div class="card modal-card" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div>
          <p style="font-weight:600;margin:0;">${escapeHtml(row.project_name)}</p>
          <p class="mono" style="font-size:11px;color:var(--ink-faint);margin:4px 0 0;">${dateStr}${row.respondent_name?' · '+escapeHtml(row.respondent_name):''}${row.department?' · '+escapeHtml(row.department):''}</p>
        </div>
        <button class="modal-close" onclick="closeSubmission()">&times;</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
          <span class="score-dot" style="background:${COLOR_HEX[band.color]};width:10px;height:10px;"></span>
          <span class="mono" style="font-size:22px;font-weight:600;">${row.total_score.toFixed(0)}</span>
          <span class="mono" style="font-size:11px;color:var(--ink-faint);">/ 168</span>
          <span style="font-size:13px;color:var(--ink-soft);">${band.label}</span>
        </div>
        ${row.notes ? `<div style="background:var(--paper);border:1px solid var(--paper-line);border-radius:8px;padding:10px 14px;margin-bottom:20px;">
          <p class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 4px;">Notes</p>
          <p style="font-size:13px;margin:0;">${escapeHtml(row.notes)}</p>
        </div>` : ""}
        <p class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 10px;">Factor scores</p>
        ${FACTOR_DEFINITIONS.map(def=>{
          const score = row.factor_scores[def.name] ?? 0;
          const pct = Math.max(0,Math.min(1,score/7));
          return `<div class="mfactor-row">
            <span class="mfactor-label" title="${escapeAttr(def.name)}">${escapeHtml(def.name)}</span>
            <div class="mfactor-track"><div class="mfactor-fill" style="width:${pct*100}%;background:${COLOR_HEX[colorMap[def.name]]}"></div></div>
            <span class="mfactor-val">${score.toFixed(1)}</span>
          </div>`;
        }).join("")}
        ${row.oric_overall!==null ? `
        <div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--paper-line);">
          <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
            <p class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:0;">ORIC readiness</p>
            <span class="mono" style="font-size:10px;color:var(--ink-faint);">scale 1–5</span>
          </div>
          <div class="oric-stats" style="max-width:none;margin-bottom:16px;">
            <div class="card oric-stat"><p class="lbl">Commitment</p><p class="val">${row.oric_commitment?.toFixed(1)??"–"}</p></div>
            <div class="card oric-stat"><p class="lbl">Efficacy</p><p class="val">${row.oric_efficacy?.toFixed(1)??"–"}</p></div>
            <div class="card oric-stat"><p class="lbl">Overall</p><p class="val">${row.oric_overall?.toFixed(1)??"–"}</p></div>
          </div>
        </div>` : ""}
      </div>
    </div>
  </div>`;
}

function dashboardView(){
  const rows = dashRows();
  return `
  <div class="admin-bar">
    <div class="row">
      <span class="mono" style="font-size:11px;color:var(--ink-faint);">Signed in as admin@dcts.siut.org</span>
      <button class="signout-link" onclick="signOutDemo()">&#8592; Sign out</button>
    </div>
  </div>
  <div class="wrap-wide dash-wrap">
    <div class="preview-banner">Preview only — this dashboard is showing 22 generated sample submissions, not real Supabase data.</div>
    <div class="dash-head">
      <h1>Assessment dashboard</h1>
      <span class="mono" style="font-size:11px;color:var(--ink-faint);">${SAMPLE_SUBMISSIONS.length} total submissions</span>
    </div>
    ${scoreSummaryHTML(rows)}
    ${sectionScoresHTML(rows)}
    ${oricSectionScoresHTML(rows)}
    ${aifDashboardSectionHTML()}
    <div class="charts-grid">
      ${factorBarChartHTML(rows)}
      <div class="chart-side-stack">
        ${domainRadarHTML(rows)}
        ${oricCardHTML(rows)}
        ${bandDonutHTML(rows)}
      </div>
    </div>
    ${scoreTrendHTML(rows)}
    ${submissionsTableHTML(rows)}
  </div>
  ${state.dashSelectedId ? submissionModalHTML(SAMPLE_SUBMISSIONS.find(r=>r.id===state.dashSelectedId)) : ""}
  `;
}

function render(){
  const main = document.getElementById("main");
  if(state.view==="landing"){ main.innerHTML = landingView(); return; }
  if(state.view==="login"){ main.innerHTML = loginView(); return; }
  if(state.view==="dashboard"){ main.innerHTML = dashboardView(); return; }
  if(state.step==="meta"){ main.innerHTML = metaView(); return; }
  if(state.step==="oric"){ main.innerHTML = oricView(); return; }
  if(state.step==="aif"){ main.innerHTML = aifQuestionnaireView(); return; }
  if(state.step==="review"){ main.innerHTML = reviewView(); return; }
  if(state.step==="done"){ main.innerHTML = doneView(); return; }
  main.innerHTML = sectionView();
}

render();
</script>
</body>
</html>
